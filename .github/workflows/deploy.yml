name: CI/CD Pipeline - Test & Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Verify Backend Build
        working-directory: ./backend
        run: |
          go mod download
          go vet ./...
          go build -v -o /dev/null ./cmd/server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare remote destination folder on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            APP_DIR="${{ secrets.APP_DIR || '/opt/truck-fleet' }}"
            mkdir -p "$APP_DIR"

      - name: Sync Project Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "backend,frontend,docker-compose.yml,.env.example,scripts,README.md"
          target: ${{ secrets.APP_DIR || '/opt/truck-fleet' }}
          overwrite: true
          strip_components: 0

      - name: Execute Deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.APP_DIR || '/opt/truck-fleet' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI || 'mongodb://mongodb:27017' }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'truck_fleet_db' }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || '*' }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || '6060' }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT || '6061' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: APP_DIR,JWT_SECRET,MONGO_URI,MONGO_DB_NAME,CORS_ORIGINS,FRONTEND_PORT,BACKEND_PORT
          script: |
            set -e
            echo "==> Navigating to deployment directory: $APP_DIR"
            cd "$APP_DIR"

            echo "==> Generating production .env configuration"
            cat <<EOF > .env
            ENV=production
            GIN_MODE=release
            FRONTEND_PORT=$FRONTEND_PORT
            BACKEND_PORT=$BACKEND_PORT
            JWT_SECRET=${JWT_SECRET:-fleet-hauling-management-secret-key-2026-supersecure}
            MONGO_URI=$MONGO_URI
            MONGO_DB_NAME=$MONGO_DB_NAME
            CORS_ORIGINS=$CORS_ORIGINS
            VITE_API_URL=/api
            EOF

            echo "==> Deploying containers with Docker Compose..."
            docker compose down --remove-orphans || true
            docker compose build --pull
            docker compose up -d

            echo "==> Waiting for services to become healthy..."
            sleep 10
            docker compose ps

            echo "==> Verifying backend healthcheck..."
            max_attempts=12
            attempt=1
            until curl -s -f http://127.0.0.1:6061/api/health > /dev/null || [ $attempt -ge $max_attempts ]; do
              echo "Waiting for backend service (attempt $attempt/$max_attempts)..."
              sleep 5
              attempt=$((attempt+1))
            done

            if curl -s -f http://127.0.0.1:6061/api/health > /dev/null; then
              echo "==> Health check PASSED: Backend is running and connected to MongoDB!"
            else
              echo "==> WARNING: Health check timeout. Inspecting logs:"
              docker compose logs --tail=50
              exit 1
            fi

            echo "==> Cleaning up dangling images to preserve VPS disk space..."
            docker image prune -f

            echo "==> Deployment completed successfully! 🚀"
