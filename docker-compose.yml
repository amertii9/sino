services:
  mongodb:
    image: mongo:7.0
    container_name: fleet_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=truck_fleet_db
    volumes:
      - mongo_data:/data/db
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet_backend
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - ENV=${ENV:-production}
      - GIN_MODE=${GIN_MODE:-release}
      - PORT=8088
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-truck_fleet_db}
      - JWT_SECRET=${JWT_SECRET:-fleet-hauling-management-secret-key-2026-supersecure}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - TRUSTED_PROXIES=127.0.0.1,frontend
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: fleet_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
    driver: local

networks:
  fleet-net:
    driver: bridge
